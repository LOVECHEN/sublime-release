name: Mirror Sublime releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source_key:
        description: Optional source key from the private mirror configuration
        default: ''
      build:
        description: Optional exact build for the selected source
        default: ''

permissions:
  contents: read

concurrency:
  group: sublime-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'LOVECHEN/sublime-release'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Mirror official builds
        env:
          GH_TOKEN: ${{ github.token }}
          SUBLIME_MIRROR_CONFIG: ${{ secrets.SUBLIME_MIRROR_CONFIG }}
          PYTHONDONTWRITEBYTECODE: '1'
          SOURCE_KEY: ${{ inputs.source_key || '' }}
          BUILD: ${{ inputs.build || '' }}
        run: python3 -I -B scripts/mirror.py

  keepalive:
    if: always() && github.repository == 'LOVECHEN/sublime-release'
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Keep scheduled workflow active
        run: |
          if [ "$(($(date +%s) - $(git log -1 --format=%ct)))" -ge 4320000 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --amend --allow-empty --no-edit
            git push --force-with-lease origin HEAD:main
          fi
